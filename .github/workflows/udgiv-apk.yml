# Lægger en ny Android-app (APK) fra Expo ud på download-siden.
# Kør den under Actions → "Udgiv APK" → Run workflow, og indsæt linket til APK'en fra Expo-buildet.
# Linket på download-siden (releases/latest/download/Mitboli.apk) peger altid på den nyeste.
name: Udgiv APK
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Link til APK'en fra Expo (https://expo.dev/artifacts/eas/....apk)"
        required: true
      version_code:
        description: "Byggenummer (versionCode), fx 9"
        required: true
      version:
        description: "Version, fx 1.0.0"
        required: true
        default: "1.0.0"
permissions:
  contents: write
concurrency:
  group: udgiv-apk
  cancel-in-progress: false

jobs:
  udgiv:
    runs-on: ubuntu-latest
    env:
      APK_URL: ${{ inputs.apk_url }}
      CODE: ${{ inputs.version_code }}
      VER: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Tjek input
        run: |
          [[ "$APK_URL" =~ ^https://expo\.dev/artifacts/eas/[A-Za-z0-9_-]+\.apk$ ]] || { echo "::error::Linket skal være en APK fra expo.dev/artifacts/eas/"; exit 1; }
          [[ "$CODE" =~ ^[0-9]{1,6}$ ]] || { echo "::error::Byggenummeret skal være et tal"; exit 1; }
          [[ "$VER" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] || { echo "::error::Versionen skal se ud som 1.0.0"; exit 1; }

      - name: Hent APK'en fra Expo
        run: |
          curl -fsSL --retry 3 --max-time 600 -o Mitboli.apk "$APK_URL"
          [ "$(head -c 2 Mitboli.apk)" = "PK" ] || { echo "::error::Filen er ikke en APK"; exit 1; }
          size=$(stat -c %s Mitboli.apk)
          [ "$size" -gt 1000000 ] && [ "$size" -lt 400000000 ] || { echo "::error::Uventet størrelse: $size"; exit 1; }
          sha256sum Mitboli.apk | cut -d' ' -f1 > sha.txt
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$signer" ]; then "$signer" verify --print-certs Mitboli.apk | grep -m1 'SHA-256 digest' | sed 's/.*: //' > cert.txt || true; fi
          echo "Størrelse: $((size / 1024 / 1024)) MB, SHA-256: $(cat sha.txt)"

      - name: Udgiv på download-siden
        run: |
          tag="v$VER-$CODE"
          sha=$(cat sha.txt); cert=$(cat cert.txt 2>/dev/null || echo "ukendt")
          notes=$(printf 'Mitboli %s (byggenummer %s).\n\nSHA-256 for filen: `%s`\nSigneringscertifikat (SHA-256): `%s`\n\nInstallér oven på den gamle version. Data bliver liggende.' "$VER" "$CODE" "$sha" "$cert")
          if gh release view "$tag" >/dev/null 2>&1; then gh release upload "$tag" Mitboli.apk --clobber; else gh release create "$tag" Mitboli.apk --title "Mitboli $VER ($CODE)" --notes "$notes" --latest; fi
          printf '{"versionCode":%s,"version":"%s","released":"%s","sha256":"%s"}\n' "$CODE" "$VER" "$(date -u +%F)" "$sha" > version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --cached --quiet || { git commit -m "Android $VER ($CODE)"; git push; }
